<section class="section quote-section">
  <div class="quote-heading">
    <h2>Let's Move Your Business Forward</h2>
    <p>Tell us what you need transported and our team will get back to you.</p>
  </div>

  <form class="quote-form" [formGroup]="form" (ngSubmit)="submitForm()">
    <div class="form-grid">
      <div class="form-field">
        <label for="companyName">Company Name</label>
        <ion-input id="companyName" formControlName="companyName" placeholder="Your company"></ion-input>
        <span class="error" *ngIf="submitted && f['companyName'].invalid">Company name is required.</span>
      </div>

      <div class="form-field">
        <label for="contactPerson">Contact Person</label>
        <ion-input id="contactPerson" formControlName="contactPerson" placeholder="Full name"></ion-input>
        <span class="error" *ngIf="submitted && f['contactPerson'].invalid">Contact person is required.</span>
      </div>

      <div class="form-field">
        <label for="phone">Phone Number</label>
        <ion-input id="phone" formControlName="phone" placeholder="082 000 0000" type="tel"></ion-input>
        <span class="error" *ngIf="submitted && f['phone'].invalid">Phone number is required.</span>
      </div>

      <div class="form-field">
        <label for="email">Email Address</label>
        <ion-input id="email" formControlName="email" placeholder="you@company.com" type="email"></ion-input>
        <span class="error" *ngIf="submitted && f['email'].invalid">A valid email is required.</span>
      </div>

      <div class="form-field">
        <label for="transportRequirement">Transport Requirement</label>
        <ion-select id="transportRequirement" formControlName="transportRequirement" placeholder="Select a service" interface="popover">
          <ion-select-option *ngFor="let opt of transportOptions" [value]="opt">{{ opt }}</ion-select-option>
        </ion-select>
        <span class="error" *ngIf="submitted && f['transportRequirement'].invalid">Please select a transport requirement.</span>
      </div>

      <div class="form-field">
        <label for="estimatedLoad">Estimated Load</label>
        <ion-input id="estimatedLoad" formControlName="estimatedLoad" placeholder="e.g. 6 tons"></ion-input>
      </div>

      <div class="form-field">
        <label for="pickupLocation">Pickup Location</label>
        <ion-input id="pickupLocation" formControlName="pickupLocation" placeholder="Suburb / town"></ion-input>
      </div>

      <div class="form-field">
        <label for="deliveryLocation">Delivery Location</label>
        <ion-input id="deliveryLocation" formControlName="deliveryLocation" placeholder="Suburb / town"></ion-input>
      </div>

      <div class="form-field">
        <label for="preferredDate">Preferred Date</label>
        <ion-input id="preferredDate" formControlName="preferredDate" type="date"></ion-input>
      </div>
    </div>

    <div class="form-field full-width">
      <label for="additionalRequirements">Additional Requirements</label>
      <ion-textarea id="additionalRequirements" formControlName="additionalRequirements" placeholder="Anything else we should know?" [autoGrow]="true" rows="3"></ion-textarea>
    </div>

    <div class="form-actions">
      <ion-button type="submit" class="btn-primary" size="large">Request a Quote</ion-button>
      <ion-button type="button" fill="outline" class="btn-outline-dark" size="large" (click)="continueOnWhatsapp()">Continue on WhatsApp</ion-button>
    </div>
  </form>
</section>
