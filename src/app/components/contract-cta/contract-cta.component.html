<section class="contract-cta">
  <div class="contract-inner">

    <p>
      Whether you require recurring vehicle capacity or are looking for a long-term transport arrangement,
      SLS is open to working with businesses to develop transport solutions around their operational requirements.
    </p>
    <div class="cta-actions">
      <ion-button class="btn-primary" size="large" routerLink="/contact">Discuss a Contract</ion-button>
      <ion-button class="btn-outline" size="large" fill="outline" [href]="whatsappUrl" target="_blank">WhatsApp SLS</ion-button>
    </div>
  </div>
</section>
